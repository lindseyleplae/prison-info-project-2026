name: Weekly Content Audit

# Checks that fail because time passed (pages overdue for re-review, external
# DOC links that went dead) rather than because of a bad push. They run on a
# schedule instead of blocking deploys: a failed run is the signal to re-verify
# the flagged pages, then update lastVerified/reviewBy or fix the link.
on:
  schedule:
    - cron: '0 14 * * 1' # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Freshness and external links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Freshness is REPORTED but does not fail the job. Some pages can never
      # auto-clear (states with no per-facility source URL; DOC sites that 403
      # automated requests), so a blocking freshness step (a) aborted the run
      # before the external-link scan below ever executed, hiding genuinely dead
      # links for weeks, and (b) would keep this audit permanently red, which is
      # how earlier real failures went unnoticed. The re-verifier works this
      # backlog down; deploy.yml is unaffected either way.
      - name: Check page freshness (reported, non-blocking)
        continue-on-error: true
        run: npm run check:freshness

      # This is the actionable check: a red audit means cited sources 404'd and
      # need fixing. `if: always()` guarantees it runs even if the step above
      # is skipped or errors for an unrelated reason.
      - name: Check external links
        if: always()
        run: npm run check:external-links
